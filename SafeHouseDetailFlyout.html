<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeHouseDetailFlyout · UI Preview</title>
<style>

/* ── Unity UI Toolkit default-shape reset ──────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
body {
    display: flex; flex-direction: column;
    background-color: var(--sm-bg, #080F14);
    color: var(--sm-text, #E6EDF3);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
}
/* Every UXML element defaults to flex-column with shrink:0 — match
   that here so authored USS that relies on those defaults works. */
.uxml-root, .uxml-root * {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: relative;
}
/* UXML buttons inherit Unity's chrome; default-strip the browser's
   button skin so per-screen USS is the only source of styling. */
.uxml-root button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
}
.uxml-root input {
    font: inherit;
    color: inherit;
    background: rgba(255,255,255,0.05);
    border: 1px solid #212C3B;
    padding: 4px 8px;
}

/* ── Assets/UI/Tokens/tokens.uss ── */
/*
 * SpyMaster · Design Tokens for Unity UI Toolkit
 * ------------------------------------------------------------
 * Source of truth: Claude Design/screens/DesignSheet.png + 01..09 screens
 * Design direction: DARK · COOL SLATE · ONE WARM ACCENT · ONE SANS · ONE MONO
 *
 * Import order:   tokens.uss  →  theme.uss  →  per-screen/component .uss
 * ------------------------------------------------------------
 */

:root {
    /* ── SURFACE ─ cool desaturated slate, dark-first */
    --sm-bg:              #080F14; /* app background */
    --sm-surface:         #111821; /* card / panel */
    --sm-surface-2:       #172030; /* nested, hover */
    --sm-surface-3:       #1E2838; /* active, raised */
    --sm-nav-bg:          #0A0E13; /* nav rail */
    --sm-topbar-bg:       #0D1319;
    --sm-ticker-bg:       #0A0E13;
    /* Phase 25.60 — canvas surfaces for the investigation graph + tech tree
       node-canvas backgrounds. Slightly lighter than --sm-bg so node cards
       (which use --sm-surface = #111821) still pop against the canvas with
       a visible edge. Pre-fix InvestigationGraph.uss / TechTreeScreen.uss
       hardcoded #0D1117 in two places, blocking theme reskin. */
    --sm-canvas-bg:       #0D1117;

    /* ── TEXT
     *
     * Phase 23d (project-wide contrast pass): the original tertiary/muted
     * values were too dark to read on `--sm-surface` — `--sm-text-muted`
     * (#3E4A58) was 2.0:1 contrast and `--sm-text-tertiary` (#5A6876) was
     * 3.1:1, both failing WCAG AA (4.5:1). They were applied as-is to key
     * labels, hint text, captions, and dossier metadata across every
     * screen, producing the dark-grey-on-dark-background problem the
     * playtest flagged. Both have been lifted while preserving their
     * relative hierarchy:
     *
     *   --sm-text            E6EDF3   ~14:1 on --sm-surface (unchanged)
     *   --sm-text-secondary  8B97A6   ~5.7:1 (unchanged, already passing)
     *   --sm-text-tertiary   94A0AD   ~6.4:1 (was 3.1:1, now passing AA)
     *   --sm-text-muted      7A8694   ~4.6:1 (was 2.0:1, now passing AA)
     *
     * NEVER drop `--sm-text-tertiary` below #828F9C or `--sm-text-muted`
     * below #6F7B8A on a `--sm-surface*` background — re-introduces the
     * unreadable-grey regression.
     */
    --sm-text:            #E6EDF3;
    --sm-text-secondary:  #8B97A6;
    --sm-text-tertiary:   #94A0AD;
    --sm-text-muted:      #7A8694;

    /* ── SEMANTIC (the one warm accent is --sm-alert) */
    --sm-alert:           #D14B3D; /* critical only — agency brand mark, CLASSIFIED, etc. */
    --sm-alert-soft:      rgba(209, 75, 61, 0.12);
    --sm-success:         #6FA37A;
    --sm-success-soft:    rgba(111, 163, 122, 0.14);
    --sm-warning:         #D9A441;
    --sm-warning-soft:    rgba(217, 164, 65, 0.12);
    --sm-info:            #4E94B8;
    --sm-info-soft:       rgba(78, 148, 184, 0.14);

    /* ── DATA PALETTE (charts, categories) */
    --sm-cat-1:           #4E94B8; /* steel blue */
    --sm-cat-2:           #8B7BA3; /* muted violet */
    --sm-cat-3:           #C28A5C; /* desaturated tan */
    --sm-cat-4:           #6FA37A; /* field green */
    --sm-cat-5:           #9AA5B3; /* slate */
    /* Phase 25.78 — per-cat soft backgrounds. Used by
       InvestigationGraph node-type header tints (rgba(N,N,N,0.18))
       which were hand-typed RGBA literals matching the cat colours
       above. Now: derived once, used everywhere. */
    --sm-cat-1-soft:      rgba(78, 148, 184, 0.18);
    --sm-cat-2-soft:      rgba(139, 123, 163, 0.18);
    --sm-cat-3-soft:      rgba(194, 138, 92, 0.18);
    --sm-cat-4-soft:      rgba(111, 163, 122, 0.18);
    --sm-cat-5-soft:      rgba(154, 165, 179, 0.18);
    /* Phase 25.79 — chip-strength alpha (0.25). Stronger than -soft
       so a small chip's tint reads from a glance against dim
       surfaces. Used by MissionReport intel-type chips. */
    --sm-cat-1-chip:      rgba(78, 148, 184, 0.25);
    --sm-cat-2-chip:      rgba(139, 123, 163, 0.25);
    --sm-cat-3-chip:      rgba(194, 138, 92, 0.25);
    --sm-cat-4-chip:      rgba(111, 163, 122, 0.25);
    --sm-warning-chip:    rgba(217, 164, 65, 0.25);
    /* Mastermind highlight — apex-tier alert tint, stronger than
       --sm-alert-soft (0.12) because it has to read as "this is
       the boss" against the dim canvas background. */
    --sm-alert-strong:    rgba(200, 50, 50, 0.22);
    --sm-alert-strong-border: rgba(200, 50, 50, 0.45);

    /* ── APPROACH COLORS (mission planner) */
    --sm-approach-stealth:   #8B7BA3; /* violet */
    --sm-approach-social:    #C28A5C; /* tan */
    --sm-approach-technical: #4E94B8; /* blue */
    --sm-approach-kinetic:   #D14B3D; /* red */

    /* ── PERSONNEL ROLE COLORS — Phase 25.77
       Per-role accent colours used by the PersonnelDossier card
       avatars + ID portraits + role chips. Pre-fix the codebase
       had four duplicate sets of `rgba(80,124,152,...)` /
       `rgba(94,156,110,...)` / `rgba(190,144,64,...)` literals
       across card-avatar and id-portrait CSS — same intent,
       hand-typed RGBA. These tokens unify them so a future
       palette tweak lands in one place.
       Field   = steel blue (operational, action)
       Analyst = field green (intelligence, analytical)
       Researcher = warm tan (R&D, slow-burn) */
    --sm-role-field:           #507C98;
    --sm-role-field-soft:      rgba(80, 124, 152, 0.22);
    --sm-role-field-border:    rgba(80, 124, 152, 0.62);
    --sm-role-analyst:         #5E9C6E;
    --sm-role-analyst-soft:    rgba(94, 156, 110, 0.22);
    --sm-role-analyst-border:  rgba(94, 156, 110, 0.62);
    --sm-role-researcher:      #BE9040;
    --sm-role-researcher-soft: rgba(190, 144, 64, 0.22);
    --sm-role-researcher-border: rgba(190, 144, 64, 0.62);

    /* ── BORDERS */
    --sm-border:          #212C3B;
    --sm-border-strong:   #2A3547;
    --sm-border-focus:    #4E94B8;

    /* ── TYPOGRAPHY */
    --sm-font-sans:   "Inter", "Segoe UI", sans-serif;
    --sm-font-mono:   "JetBrains Mono", "Consolas", monospace;
    /* Phase v2-polish (May 2026) — slab serif for screen titles + display
       headlines. Inter at 28-48pt reads SaaS; a slab serif at the same sizes
       reads as institutional report typography (Bloomberg, FT, declassified
       CIA cables). One slab title per screen is enough to break the dark-
       mode-SaaS read. Ship-with-fallback chain so missing fonts degrade to
       sans-serif without breaking layouts. Drop-in font when art commissions
       a final pick: Roboto Slab Bold or Zilla Slab. */
    --sm-font-slab:   "Roboto Slab", "Zilla Slab", "Rockwell", "Inter", serif;
    /* Phase v2-polish — characterful mono for hero data values. The default
       --sm-font-mono uses JetBrains Mono which is the SaaS-default mono in
       2025. For BIG numerals (BLACK BUDGET, GLOBAL HEAT, DOOMSDAY, mission
       SCORE) and signature monospace moments (Director's Desk header, the
       ticker), prefer this characterful mono. Fallback to JetBrains Mono so
       nothing breaks. Drop-in when licensed: Berkeley Mono. */
    --sm-font-mono-display: "Berkeley Mono", "Departure Mono", "IBM Plex Mono", "JetBrains Mono", monospace;

    --sm-text-xs:   10px;
    --sm-text-sm:   11px;
    --sm-text-md:   13px;
    --sm-text-lg:   15px;
    --sm-text-xl:   20px;
    --sm-text-2xl:  28px;
    --sm-text-3xl:  36px;
    --sm-text-display: 48px;
    /* Phase v2-polish — micro size for stationery/terminal-status chrome.
       Used by .sm-stationery-header (DOC.ID · CLASS · DIST tags) and
       .sm-terminal-status (BUILD · SESSION · CHANNEL · LATENCY footer). */
    --sm-text-micro: 9px;

    --sm-letter-label: 1.4px;
    /* Phase v2-polish — extra letter-spacing for caps-mono labels.
       The institutional-document feel comes from breathing letter-spacing
       on small caps rather than from larger sizes. */
    --sm-letter-mono-caps: 0.6px;

    /* ── SPACING (4 / 8 scale) */
    --sm-s-1: 4px;
    --sm-s-2: 8px;
    --sm-s-3: 12px;
    --sm-s-4: 16px;
    --sm-s-5: 20px;
    --sm-s-6: 24px;
    --sm-s-8: 32px;
    --sm-s-10: 40px;
    --sm-s-12: 48px;

    /* ── CHROME HEIGHTS */
    --sm-topbar-h:  56px;
    --sm-navrail-w: 84px;
    --sm-ticker-h:  52px;

    /* ── MOTION */
    --sm-dur-fast:    120ms;
    --sm-dur-base:    200ms;
    --sm-dur-slow:    380ms;

    /* ── RADII — minimal, sharp */
    --sm-r-0: 0;
    --sm-r-1: 1px;
    --sm-r-2: 2px;

    /* ── BORDERS (stroke width) */
    --sm-stroke: 1px;
    --sm-stroke-2: 2px;

    /* =========================================================
     * Phase v2-polish (May 2026) — DIFFERENTIATION TOKENS
     * Reference: Assets/../Claude Design/PRESENT_VISUAL_DIFFERENTIATION.md
     *
     * These tokens implement the v2 polish moves that distinguish
     * SpyMaster from generic dark-mode SaaS. They reuse existing
     * palette tokens above (--sm-alert is already classified-red
     * #D14B3D — we just commit to it as the AGENCY IDENTITY color
     * rather than reserving it strictly for critical state).
     * ========================================================= */

    /* Agency identity — classified-red is THE agency mark color.
       Reuse --sm-alert for crests / primary identity moments. The
       existing --sm-info (steel blue) remains the data-active /
       focus highlight, NOT the brand. */
    --sm-identity:        var(--sm-alert);          /* #D14B3D */
    --sm-identity-soft:   var(--sm-alert-soft);     /* tinted bg */
    --sm-identity-strong: var(--sm-alert-strong);   /* mastermind tier */

    /* Paper-grain texture — already authored in MainMenu/paper-grain.svg.
       Use as a subliminal overlay on panel backgrounds. 2-4% opacity.
       Apply via the .sm-paper-grain utility class (theme-present-polish.uss). */
    --sm-paper-grain-url: url("project://database/Assets/UI/MainMenu/paper-grain.svg");
    --sm-paper-grain-opacity: 0.03;

    /* Stationery chrome opacity — the DOC.ID · CLASS · DIST headers
       on every panel should be present but quiet. Mono 9pt at this
       opacity reads as "official document chrome" without competing
       with content. */
    --sm-stationery-opacity: 0.55;

    /* Terminal-status footer — the BUILD · SESSION · CHANNEL strip
       at the bottom of every screen. Same opacity register as
       stationery so they read as one chrome layer. */
    --sm-terminal-status-h: 24px;

    /* Era-theme scaffolding — applied to .sm-root via EraThemeController.
       For v1 ship we apply .era-present at runtime. .era-coldwar and
       .era-futuristic exist as empty hooks for future DLC. The actual
       per-era token overrides live in tokens.<era>.uss files (only
       tokens.present.uss is authored for v1 — and it's a no-op against
       these defaults, since these defaults ARE the Present-era values). */
}

/* =========================================================
 * Phase v2-polish — ERA HOOKS
 * Empty selectors so per-era stylesheets can override targeted
 * tokens without restructuring the :root. Future DLC ships per-era
 * tokens.<era>.uss that scope under these selectors.
 * ========================================================= */
.era-present { }
.era-coldwar { }
.era-futuristic { }

/* ── Assets/UI/Theme/theme.uss ── */
/*
 * SpyMaster · Base Theme
 * ------------------------------------------------------------
 * Element + utility styles built on tokens.uss. Import both as
 * StyleSheets on your root PanelSettings.
 *
 *   Root (UIDocument) → <UXML> references these classes.
 *
 * Fonts (live):
 *   sans  → Assets/Fonts/Inter/Inter-Regular.ttf  (default on .sm-root)
 *   mono  → Assets/Fonts/JetBrainsMono/JetBrainsMono-Regular.ttf  (.sm-mono / .sm-num)
 *   bolds → font-weight: 700;
    overflow: hidden;
    background-color: rgba(0, 0, 0, 0);
    color: var(--sm-text);
    font-size: var(--sm-text-md);
    
}

/* =========================================================
 * LAYOUT PRIMITIVES
 *   .sm-row  — horizontal flex
 *   .sm-col  — vertical flex (default for Unity, here for clarity)
 *   .sm-fill — flex-grow 1
 * ========================================================= */
.sm-row { flex-direction: row; }
.sm-col { flex-direction: column; }
.sm-fill { flex-grow: 1; }

/* Phase 37-transitions — screen fade-in.
 * SpyMasterShellUI.ShowScreen() adds this class on the cloned screen
 * tree, sets opacity:0 immediately, then schedules opacity:1 one frame
 * later. The transition rule below makes the opacity flip animate.
 * 220ms (slightly longer than --sm-dur-base 200ms) feels intentional
 * without dragging on long screen transitions. */
.sm-screen-fade {
    transition-property: opacity;
    transition-duration: 220ms;
    transition-timing-function: ease-out;
}

/* Phase 37-endgame — paced reveal animation for the post-campaign
 * NewGamePlus screen. The controller hides each element (opacity:0,
 * translate:0 8px) at populate-time, then schedules a staggered class
 * flip via .sm-endgame-revealed. Effect: a 320ms ease-out slide-up
 * fade per item, sequenced ~90ms apart, so the score breakdown lands
 * one beat at a time instead of all at once. Players who earned an S
 * (or an F) get a dramatic moment to actually feel it.
 *
 * The rating letter uses .sm-endgame-rating-punch instead — same
 * fade, but with a scale 0.65 → 1.0 punch-in over 500ms for the
 * emotional payoff hit. */
.sm-endgame-reveal-item {
    transition-property: opacity, translate;
    transition-duration: 320ms;
    transition-timing-function: ease-out;
}
.sm-endgame-rating-punch {
    transition-property: opacity, scale;
    transition-duration: 500ms;
    transition-timing-function: ease-out;
}
.sm-center { align-items: center; justify-content: center; }

/* =========================================================
 * PANEL — the fundamental container
 * ========================================================= */
.sm-panel {
    background-color: var(--sm-surface);
    border-left-width: var(--sm-stroke);
    border-right-width: var(--sm-stroke);
    border-top-width: var(--sm-stroke);
    border-bottom-width: var(--sm-stroke);
    border-left-color: var(--sm-border);
    border-right-color: var(--sm-border);
    border-top-color: var(--sm-border);
    border-bottom-color: var(--sm-border);
    border-top-left-radius: var(--sm-r-2);
    border-top-right-radius: var(--sm-r-2);
    border-bottom-left-radius: var(--sm-r-2);
    border-bottom-right-radius: var(--sm-r-2);
}

.sm-panel--flush {
    border-top-left-radius: 0;
    border-top-right-radius: 0;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
}

.sm-panel__header {
    flex-direction: row;
    align-items: center;
    padding-top: var(--sm-s-3);
    padding-bottom: var(--sm-s-3);
    padding-left: var(--sm-s-4);
    padding-right: var(--sm-s-4);
    border-bottom-width: var(--sm-stroke);
    border-bottom-color: var(--sm-border);
    background-color: var(--sm-surface-2);
}

.sm-panel__title {
    font-size: var(--sm-text-sm);
    letter-spacing: var(--sm-letter-label);
    font-weight: 700;
    color: var(--sm-text);
    text-align: left; justify-content: left; align-items: flex-start;
    /* text-transform not supported by Unity USS — author labels in UPPERCASE directly. */
}

.sm-panel__body {
    padding-top: var(--sm-s-4);
    padding-bottom: var(--sm-s-4);
    padding-left: var(--sm-s-4);
    padding-right: var(--sm-s-4);
}

/* =========================================================
 * TYPOGRAPHY
 * ========================================================= */
.sm-mono {
    
}
.sm-mono-bold {
    
    font-weight: 700;
}

.sm-label {
    font-size: var(--sm-text-xs);
    letter-spacing: var(--sm-letter-label);
    color: var(--sm-text-secondary);
}
.sm-h1 { font-size: var(--sm-text-3xl); font-weight: 400; font-style: normal; color: var(--sm-text); }
.sm-h2 { font-size: var(--sm-text-2xl); color: var(--sm-text); }
.sm-h3 { font-size: var(--sm-text-xl);  color: var(--sm-text); }
.sm-body { font-size: var(--sm-text-md); color: var(--sm-text); }
/* Phase 25.69 — caption variant for the design-system TextLabel
   factory. Smaller + secondary colour for legend / hint / metadata
   text. Pre-fix dozens of inline `style.fontSize = 10` +
   `style.color = secondary-grey` patterns reinvented this. */
.sm-caption { font-size: var(--sm-text-xs); color: var(--sm-text-secondary); }
.sm-secondary { color: var(--sm-text-secondary); }
.sm-tertiary  { color: var(--sm-text-tertiary); }
.sm-muted     { color: var(--sm-text-muted); }

.sm-num {
    
    font-weight: 400; font-style: normal;
}

/* =========================================================
 * BUTTONS
 *   Usage: <Button class="sm-btn sm-btn--primary" text="SIGN OFF" />
 * ========================================================= */
.sm-btn {
    height: 32px;
    padding-left: var(--sm-s-3);
    padding-right: var(--sm-s-3);
    padding-top: 0;
    padding-bottom: 0;
    margin: 0;
    background-color: rgba(0,0,0,0);
    border-left-width: var(--sm-stroke);
    border-right-width: var(--sm-stroke);
    border-top-width: var(--sm-stroke);
    border-bottom-width: var(--sm-stroke);
    border-left-color: var(--sm-border-strong);
    border-right-color: var(--sm-border-strong);
    border-top-color: var(--sm-border-strong);
    border-bottom-color: var(--sm-border-strong);
    border-top-left-radius: var(--sm-r-2);
    border-top-right-radius: var(--sm-r-2);
    border-bottom-left-radius: var(--sm-r-2);
    border-bottom-right-radius: var(--sm-r-2);
    color: var(--sm-text);
    font-size: var(--sm-text-sm);
    letter-spacing: var(--sm-letter-label);
    font-weight: 700;
    transition-property: background-color, border-color, color;
    transition-duration: var(--sm-dur-fast);
}
.sm-btn:hover {
    background-color: var(--sm-surface-2);
    border-left-color: var(--sm-border-focus);
    border-right-color: var(--sm-border-focus);
    border-top-color: var(--sm-border-focus);
    border-bottom-color: var(--sm-border-focus);
}
.sm-btn:active { background-color: var(--sm-surface-3); }
.sm-btn:disabled { opacity: 0.4; }

.sm-btn--primary {
    background-color: var(--sm-alert);
    border-left-color: var(--sm-alert);
    border-right-color: var(--sm-alert);
    border-top-color: var(--sm-alert);
    border-bottom-color: var(--sm-alert);
    color: #0B0F14;
}
.sm-btn--primary:hover {
    background-color: #E35A4C;
    border-left-color: #E35A4C;
    border-right-color: #E35A4C;
    border-top-color: #E35A4C;
    border-bottom-color: #E35A4C;
}

.sm-btn--outline {
    border-left-color: var(--sm-text-secondary);
    border-right-color: var(--sm-text-secondary);
    border-top-color: var(--sm-text-secondary);
    border-bottom-color: var(--sm-text-secondary);
    color: var(--sm-text);
}

.sm-btn--ghost {
    border-left-color: rgba(0,0,0,0);
    border-right-color: rgba(0,0,0,0);
    border-top-color: rgba(0,0,0,0);
    border-bottom-color: rgba(0,0,0,0);
    color: var(--sm-text-secondary);
}
.sm-btn--ghost:hover { background-color: var(--sm-surface-2); color: var(--sm-text); }

.sm-btn--danger {
    background-color: var(--sm-alert-soft);
    border-left-color: var(--sm-alert);
    border-right-color: var(--sm-alert);
    border-top-color: var(--sm-alert);
    border-bottom-color: var(--sm-alert);
    color: var(--sm-alert);
}

/* =========================================================
 * BUTTON SIZES — Phase 25.67
 * ---------------------------------------------------------
 * Default .sm-btn = MD (32 px height). Variants below let
 * callers shrink to SM / XS for dense UIs (canvas-header
 * controls, chip-style filter buttons) or grow to LG for
 * landing-page CTAs. NEVER set font-size / padding inline
 * on a button — pick the right size variant. If an existing
 * inline value doesn't match any variant, add the missing
 * size HERE rather than override inline.
 * ========================================================= */
.sm-btn--xs {
    height: 22px;
    padding-left: var(--sm-s-2);
    padding-right: var(--sm-s-2);
    font-size: var(--sm-text-xs);
}
.sm-btn--sm {
    height: 26px;
    padding-left: var(--sm-s-2);
    padding-right: var(--sm-s-2);
    font-size: var(--sm-text-xs);
}
.sm-btn--lg {
    height: 40px;
    padding-left: var(--sm-s-4);
    padding-right: var(--sm-s-4);
    font-size: var(--sm-text-md);
}

/* Phase 25.67 — mono modifier for chip-style filter buttons
   that read as labels. Combine with --xs / --sm. */
.sm-btn--mono {
    letter-spacing: 1px;
}

/* Phase 25.67 — IconButton: square button, no text. Default
   32×32 (MD); --xs/--sm/--lg variants apply via .sm-btn-icon--xs
   etc. The inner icon element should be sized to match. */
.sm-btn-icon {
    width: 32px;
    height: 32px;
    padding: 0;
    margin: 0;
    align-items: center;
    justify-content: center;
}
.sm-btn-icon--xs { width: 22px; height: 22px; }
.sm-btn-icon--sm { width: 26px; height: 26px; }
.sm-btn-icon--lg { width: 40px; height: 40px; }

/* =========================================================
 * BORDERED CARD PANEL — Phase 25.70
 * ---------------------------------------------------------
 * Used by BorderedCardPanel.Build(...) to wrap content in
 * the design-system card chrome: 1 px outer border + 3 px
 * left-edge accent + radius + standardised padding.
 * Severity variants (--info / --success / --warning / --alert
 * / --story) tint the left edge; padding variants (compact /
 * standard / loose) drive the inside breathing room.
 * ========================================================= */
.sm-card {
    margin-left: 6px;
    margin-right: 6px;
    padding-top: var(--sm-s-2);
    padding-bottom: var(--sm-s-2);
    padding-left: var(--sm-s-3);
    padding-right: var(--sm-s-3);
    background-color: var(--sm-surface);
    border-top-width: var(--sm-stroke);
    border-bottom-width: var(--sm-stroke);
    border-right-width: var(--sm-stroke);
    border-left-width: 3px;
    border-top-color: var(--sm-border);
    border-bottom-color: var(--sm-border);
    border-right-color: var(--sm-border);
    border-left-color: var(--sm-surface-3);
    border-top-left-radius: var(--sm-r-2);
    border-top-right-radius: var(--sm-r-2);
    border-bottom-left-radius: var(--sm-r-2);
    border-bottom-right-radius: var(--sm-r-2);
}
/* Severity accents — drive the left-edge tint. Token refs so
   theme reskin updates every card. */
.sm-card--info    { border-left-color: var(--sm-info); }
.sm-card--success { border-left-color: var(--sm-success); }
.sm-card--warning { border-left-color: var(--sm-warning); }
.sm-card--alert   { border-left-color: var(--sm-alert); }
.sm-card--story   { border-left-color: var(--sm-cat-2); }

/* Padding tiers. */
.sm-card--pad-compact {
    padding-top: var(--sm-s-1);
    padding-bottom: var(--sm-s-1);
    padding-left: var(--sm-s-2);
    padding-right: var(--sm-s-2);
}
.sm-card--pad-loose {
    padding-top: var(--sm-s-3);
    padding-bottom: var(--sm-s-3);
    padding-left: var(--sm-s-4);
    padding-right: var(--sm-s-4);
}

/* Phase 25.82 — interactive variant. Pre-fix the BRIEF-tab IntelCardRow
   and EdgeLine builders registered PointerEnter/Leave callbacks that
   manually swapped backgroundColor between two hand-typed RGBA literals
   on hover. Now: a single USS hover rule lifts the surface one notch so
   every clickable card in the codebase reads with the same hover affordance
   without any C# event wiring. Compose with `sm-card sm-card--clickable`. */
.sm-card--clickable {
    /* No baseline visual change — hover rule below provides the read. */
}
.sm-card--clickable:hover {
    background-color: var(--sm-surface-2);
}

/* =========================================================
 * STAT TILE — Phase 25.72
 * ---------------------------------------------------------
 * "Label / big value / subtitle" stack used by TopBar tiles,
 * AgencyDashboard hero chips, BudgetScreen overview, etc.
 * Three size tiers map to a coherent type scale; severity
 * variants tint the value.
 * ========================================================= */
.sm-stat-tile {
    flex-direction: column;
    align-items: flex-start;
    padding-top: var(--sm-s-1);
    padding-bottom: var(--sm-s-1);
    padding-left: var(--sm-s-2);
    padding-right: var(--sm-s-2);
}
.sm-stat-tile__label {
    color: var(--sm-text-secondary);
    margin-bottom: 2px;
}
.sm-stat-tile__value {
    color: var(--sm-text);
    font-size: var(--sm-text-md);
    font-weight: 700;
}
.sm-stat-tile__subtitle {
    color: var(--sm-text-tertiary);
    margin-top: 2px;
}
/* Hero size — dashboard hero chips. */
.sm-stat-tile--hero .sm-stat-tile__value {
    font-size: var(--sm-text-xl);
}
/* Display size — budget screen / landing-page big numbers. */
.sm-stat-tile--display .sm-stat-tile__value {
    font-size: var(--sm-text-3xl);
}
/* Severity tinting on the value only — label + subtitle stay
   secondary so the colour-coded value reads as the signal. */
.sm-stat-tile__value--info    { color: var(--sm-info); }
.sm-stat-tile__value--success { color: var(--sm-success); }
.sm-stat-tile__value--warning { color: var(--sm-warning); }
.sm-stat-tile__value--alert   { color: var(--sm-alert); }

/* =========================================================
 * EMPTY STATE PANEL — Phase 25.73
 * ---------------------------------------------------------
 * Used by EmptyStatePanel.Build(...) for "this list is empty
 * because X, here's what to do" surfaces. Hero style centres
 * content + adds a glyph; Card style is the default.
 * ========================================================= */
.sm-empty-inline {
    color: var(--sm-text-secondary);
    margin-top: 4px;
    margin-bottom: 4px;
    margin-left: 6px;
    margin-right: 6px;
}
.sm-empty--card {
    /* sm-card already provides chrome; nothing extra needed. */
}
.sm-empty--hero {
    align-items: center;
    margin-top: var(--sm-s-4);
    margin-bottom: var(--sm-s-4);
}
.sm-empty__glyph {
    color: var(--sm-text-tertiary);
    text-align: center; justify-content: center; align-items: center;
    margin-bottom: var(--sm-s-2);
}
.sm-empty__title {
    margin-bottom: var(--sm-s-1);
}
.sm-empty__body {
    color: var(--sm-text-secondary);
    margin-top: 2px;
    margin-bottom: var(--sm-s-2);
    white-space: normal;
}
.sm-empty__cta {
    align-self: flex-start;
}

/* =========================================================
 * GAUGE BAR — Phase 25.74
 * ---------------------------------------------------------
 * Horizontal track + fill with severity-tinted fill colour.
 * Used by BudgetScreen confidence gauge, audit-risk indicator,
 * AgencyDashboard heat track, blowback meter.
 * ========================================================= */
.sm-gauge {
    flex-direction: row;
    align-items: center;
    width: 100%;
}
.sm-gauge__track {
    flex-grow: 1;
    height: 100%;
    background-color: var(--sm-surface-3);
    border-top-left-radius: 1px;
    border-top-right-radius: 1px;
    border-bottom-left-radius: 1px;
    border-bottom-right-radius: 1px;
}
.sm-gauge__fill {
    height: 100%;
    width: 0;
    background-color: var(--sm-text-tertiary);
    border-top-left-radius: 1px;
    border-top-right-radius: 1px;
    border-bottom-left-radius: 1px;
    border-bottom-right-radius: 1px;
}
.sm-gauge__fill--info    { background-color: var(--sm-info); }
.sm-gauge__fill--success { background-color: var(--sm-success); }
.sm-gauge__fill--warning { background-color: var(--sm-warning); }
.sm-gauge__fill--alert   { background-color: var(--sm-alert); }

/* =========================================================
 * TOGGLE CHIP — Phase 25.74
 * ---------------------------------------------------------
 * Filter / on-off chip used in canvas-header layer toggles
 * + inbox filter chips. The on/off state classes drive the
 * fill and text colour; the underlying chrome is the same
 * sm-btn--ghost + sm-btn--xs + sm-btn--mono mix.
 * ========================================================= */
.sm-toggle-chip--on {
    background-color: var(--sm-surface-3);
    color: var(--sm-text);
}
.sm-toggle-chip--off {
    background-color: rgba(0,0,0,0);
    color: var(--sm-text-muted);
}

/* =========================================================
 * DETAIL PANEL CHROME — Phase 25.75
 * ---------------------------------------------------------
 * Three-region (header / body / footer) layout used by every
 * right-side detail pane. Body subsections stay free-form
 * per design intent ("subsections can be reusable or inline,
 * that's fine"), but the chrome shape is unified.
 * ========================================================= */
.sm-detail {
    flex-direction: column;
    flex-grow: 1;
    background-color: var(--sm-surface);
}
.sm-detail__header {
    flex-direction: column;
    flex-shrink: 0;
    padding-top: var(--sm-s-3);
    padding-bottom: var(--sm-s-2);
    padding-left: var(--sm-s-4);
    padding-right: var(--sm-s-4);
    border-bottom-width: var(--sm-stroke);
    border-bottom-color: var(--sm-border);
}
.sm-detail__body {
    flex-grow: 1;
    flex-shrink: 1;
    padding-top: var(--sm-s-2);
    padding-bottom: var(--sm-s-2);
    padding-left: var(--sm-s-3);
    padding-right: var(--sm-s-3);
}
.sm-detail__footer {
    flex-direction: row;
    align-items: center;
    flex-shrink: 0;
    padding-top: var(--sm-s-2);
    padding-bottom: var(--sm-s-2);
    padding-left: var(--sm-s-3);
    padding-right: var(--sm-s-3);
    border-top-width: var(--sm-stroke);
    border-top-color: var(--sm-border);
    background-color: var(--sm-surface-2);
}

/* =========================================================
 * INPUTS (TextField)
 * ========================================================= */

/* Global caret + selection colours — UI Toolkit's defaults are dark and
 * vanish against our dark surfaces. Apply to every TextField's inner
 * editable element so the caret is always visible regardless of which
 * .sm-* wrapper class is on the field. */
TextField > .unity-text-field__input,
.unity-text-field__input {
    --unity-cursor-color: var(--sm-text);
    --unity-selection-color: var(--sm-border-focus);
}

.sm-input > .unity-text-field__input,
.sm-input {
    background-color: var(--sm-surface);
    border-left-width: var(--sm-stroke);
    border-right-width: var(--sm-stroke);
    border-top-width: var(--sm-stroke);
    border-bottom-width: var(--sm-stroke);
    border-left-color: var(--sm-border-strong);
    border-right-color: var(--sm-border-strong);
    border-top-color: var(--sm-border-strong);
    border-bottom-color: var(--sm-border-strong);
    border-top-left-radius: var(--sm-r-2);
    border-top-right-radius: var(--sm-r-2);
    border-bottom-left-radius: var(--sm-r-2);
    border-bottom-right-radius: var(--sm-r-2);
    color: var(--sm-text);
    font-size: var(--sm-text-md);
    padding-top: 6px;
    padding-bottom: 6px;
    padding-left: var(--sm-s-3);
    padding-right: var(--sm-s-3);
    min-height: 30px;
}
.sm-input:focus > .unity-text-field__input {
    border-left-color: var(--sm-border-focus);
    border-right-color: var(--sm-border-focus);
    border-top-color: var(--sm-border-focus);
    border-bottom-color: var(--sm-border-focus);
}

/* =========================================================
 * BADGE
 * ========================================================= */
.sm-badge {
    flex-direction: row;
    align-items: center;
    padding-top: 2px;
    padding-bottom: 2px;
    padding-left: 7px;
    padding-right: 7px;
    background-color: var(--sm-surface-2);
    border-left-width: var(--sm-stroke);
    border-right-width: var(--sm-stroke);
    border-top-width: var(--sm-stroke);
    border-bottom-width: var(--sm-stroke);
    border-left-color: var(--sm-border);
    border-right-color: var(--sm-border);
    border-top-color: var(--sm-border);
    border-bottom-color: var(--sm-border);
    border-top-left-radius: var(--sm-r-2);
    border-top-right-radius: var(--sm-r-2);
    border-bottom-left-radius: var(--sm-r-2);
    border-bottom-right-radius: var(--sm-r-2);
    font-size: var(--sm-text-xs);
    letter-spacing: var(--sm-letter-label);
    color: var(--sm-text-secondary);
    font-weight: 700;
}
.sm-badge--alert   { background-color: var(--sm-alert-soft);   color: var(--sm-alert);   border-left-color: rgba(209,75,61,0.35); border-right-color: rgba(209,75,61,0.35); border-top-color: rgba(209,75,61,0.35); border-bottom-color: rgba(209,75,61,0.35); }
.sm-badge--success { background-color: var(--sm-success-soft); color: var(--sm-success); border-left-color: rgba(111,163,122,0.3); border-right-color: rgba(111,163,122,0.3); border-top-color: rgba(111,163,122,0.3); border-bottom-color: rgba(111,163,122,0.3); }
.sm-badge--warning { background-color: var(--sm-warning-soft); color: var(--sm-warning); border-left-color: rgba(217,164,65,0.3); border-right-color: rgba(217,164,65,0.3); border-top-color: rgba(217,164,65,0.3); border-bottom-color: rgba(217,164,65,0.3); }
.sm-badge--info    { background-color: var(--sm-info-soft);    color: var(--sm-info);    border-left-color: rgba(78,148,184,0.3); border-right-color: rgba(78,148,184,0.3); border-top-color: rgba(78,148,184,0.3); border-bottom-color: rgba(78,148,184,0.3); }
/* Phase 25.71 — story badge variant for narrative-significance
   surfaces (cinematic beat callouts, story-chain reveals, etc).
   Tinted toward --sm-cat-2 (muted violet) which is reserved as the
   story palette across the rest of the codebase. */
.sm-badge--story   { background-color: rgba(139,123,163,0.14);  color: var(--sm-cat-2);   border-left-color: rgba(139,123,163,0.3); border-right-color: rgba(139,123,163,0.3); border-top-color: rgba(139,123,163,0.3); border-bottom-color: rgba(139,123,163,0.3); }

/* =========================================================
 * STAT BLOCK (label / big number / sub)
 * ========================================================= */
.sm-stat { flex-direction: column; }
.sm-stat__value {
    font-size: var(--sm-text-xl);
    font-weight: 700;
    color: var(--sm-text);
}
.sm-stat__sub { font-size: var(--sm-text-sm); color: var(--sm-text-secondary); }
.sm-stat--alert   > .sm-stat__value { color: var(--sm-alert); }
.sm-stat--success > .sm-stat__value { color: var(--sm-success); }
.sm-stat--warning > .sm-stat__value { color: var(--sm-warning); }

/* =========================================================
 * TICKER BAR — bottom-of-screen event feed
 * ========================================================= */
.sm-ticker {
    height: 28px;
    flex-direction: row;
    align-items: center;
    background-color: var(--sm-nav-bg);
    border-top-width: var(--sm-stroke);
    border-top-color: var(--sm-border);
    overflow: hidden;
}
.sm-ticker__badge {
    padding-left: var(--sm-s-3);
    padding-right: var(--sm-s-3);
    color: var(--sm-alert);
    font-size: var(--sm-text-xs);
    letter-spacing: var(--sm-letter-label);
    font-weight: 700;
}

/* =========================================================
 * CLASSIFIED BANNER
 * ========================================================= */
.sm-banner--classified {
    flex-direction: row;
    align-items: center;
    padding-top: var(--sm-s-2);
    padding-bottom: var(--sm-s-2);
    padding-left: var(--sm-s-4);
    padding-right: var(--sm-s-4);
    background-color: var(--sm-alert-soft);
    border-left-width: 3px;
    border-left-color: var(--sm-alert);
    border-top-width: var(--sm-stroke);
    border-top-color: rgba(209,75,61,0.3);
    border-bottom-width: var(--sm-stroke);
    border-bottom-color: rgba(209,75,61,0.3);
}

/* =========================================================
 * CONFIDENCE INTERVAL — see ConfidenceInterval.uss
 * ========================================================= */

/* =========================================================
 * LIVE dot (used by TopBar + Ticker) — breathing animation
 * ========================================================= */
.sm-live-dot {
    width: 8px;
    height: 8px;
    background-color: var(--sm-alert);
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
}

/* =========================================================
 * ICON — square line icon using VectorImage (Assets/UI/Icons)
 * ========================================================= */
.sm-icon {
    width: 20px;
    height: 20px;
    
}
.sm-icon-sm { width: 14px; height: 14px; }
.sm-icon-lg { width: 28px; height: 28px; }
.sm-icon--muted {  }
.sm-icon--alert {  }
.sm-icon--success {  }

/* =========================================================
 * EMPTY STATE label (used when lists have no data)
 * ========================================================= */
.sm-empty-state {
    color: var(--sm-text-tertiary);
    font-size: var(--sm-text-sm);
    padding-top: var(--sm-s-3);
    padding-bottom: var(--sm-s-3);
    text-align: center; justify-content: center; align-items: center;
}

/* =========================================================
 * CUSTOM SCROLLBARS (global)
 *
 * Replaces Unity's default chunky scrollbar with a thin,
 * floating thumb that fades into the background when idle and
 * snaps to the info-blue accent when dragged.
 *
 * Mirrored into theme.uss so every screen that loads this
 * stylesheet gets the styling automatically — previously the
 * rules lived only in Shared/Scrollbars.uss and only ShellUI
 * imported them, leaving MainMenu/CharacterCreation/overlays
 * with the default Unity scrollbar.
 *
 * Unity UITK scrollbar element tree:
 *   Scroller  (.unity-scroller  +  --vertical / --horizontal)
 *   ├── RepeatButton  (.unity-scroller__low-button)   ← hidden
 *   ├── Slider  (.unity-base-slider)
 *   │   └── .unity-base-slider__input
 *   │       ├── .unity-base-slider__tracker
 *   │       └── .unity-base-slider__dragger
 *   └── RepeatButton  (.unity-scroller__high-button)  ← hidden
 *
 * All thumb/track rules are scoped to .unity-scroller so they
 * never bleed into standalone Slider controls (progress bars).
 * ========================================================= */

/* Vertical bar — 8 px wide strip; faint 1 px left rule. */
.unity-scroller--vertical {
    width: 8px;
    min-width: 8px;
    background-color: rgba(0, 0, 0, 0);
    border-left-width: 1px;
    border-left-color: rgba(33, 44, 59, 0.55);
    border-right-width: 0;
    border-top-width: 0;
    border-bottom-width: 0;
    padding-top: 4px;
    padding-bottom: 4px;
    padding-left: 0;
    padding-right: 0;
}

/* Horizontal bar — 8 px tall strip; faint 1 px top rule. */
.unity-scroller--horizontal {
    height: 8px;
    min-height: 8px;
    background-color: rgba(0, 0, 0, 0);
    border-top-width: 1px;
    border-top-color: rgba(33, 44, 59, 0.55);
    border-left-width: 0;
    border-right-width: 0;
    border-bottom-width: 0;
    padding-left: 4px;
    padding-right: 4px;
    padding-top: 0;
    padding-bottom: 0;
}

/* Arrow buttons — removed entirely. */
.unity-scroller__low-button,
.unity-scroller__high-button {
    display: none;
}

/* Inner slider element holding the track + thumb. */
.unity-scroller .unity-base-slider {
    margin: 0;
    padding: 0;
    flex-grow: 1;
    background-color: rgba(0, 0, 0, 0);
    border-left-width: 0;
    border-right-width: 0;
    border-top-width: 0;
    border-bottom-width: 0;
}

.unity-scroller .unity-base-slider__input {
    background-color: rgba(0, 0, 0, 0);
    border-left-width: 0;
    border-right-width: 0;
    border-top-width: 0;
    border-bottom-width: 0;
    margin: 0;
    padding: 0;
}

/* Track — fully transparent; the 1 px scroller border is the guide. */
.unity-scroller .unity-base-slider__tracker {
    background-color: rgba(0, 0, 0, 0);
    border-left-width: 0;
    border-right-width: 0;
    border-top-width: 0;
    border-bottom-width: 0;
}

/* Thumb (dragger) — 4 px visible, three states. */
.unity-scroller .unity-base-slider__dragger {
    margin-left: 2px;
    margin-right: 2px;
    margin-top: 2px;
    margin-bottom: 2px;

    background-color: rgba(255, 255, 255, 0.10);

    border-top-left-radius: 2px;
    border-top-right-radius: 2px;
    border-bottom-left-radius: 2px;
    border-bottom-right-radius: 2px;

    border-left-width: 0;
    border-right-width: 0;
    border-top-width: 0;
    border-bottom-width: 0;

    transition-property: background-color;
    transition-duration: var(--sm-dur-fast);
    transition-timing-function: ease-out;
}

.unity-scroller .unity-base-slider__dragger:hover {
    background-color: rgba(255, 255, 255, 0.24);
}

.unity-scroller .unity-base-slider__dragger:active {
    background-color: rgba(78, 148, 184, 0.80);
}


/* ──────────────────────────────────────────────────────────────────── */
/*  Phase 21 polish: canonical close button.                            */
/*  Replaces the legacy <Button text="✕"/> pattern that shipped         */
/*  text-as-icon across 17 modals/overlays. All UXML close affordances  */
/*  add `class="sm-close-btn"` and the SVG x icon renders at 12 px.     */
/* ──────────────────────────────────────────────────────────────────── */

.sm-close-btn {
    width: 28px;
    height: 28px;
    padding: 0;
    margin: 0;
    border-left-width: 0;
    border-right-width: 0;
    border-top-width: 0;
    border-bottom-width: 0;
    background-color: rgba(0, 0, 0, 0);
    background-image: url("project://database/Assets/UI/Icons/x.svg");
    
    
    color: rgba(0, 0, 0, 0);   /* hide any stray text content */
    transition-property: background-color, -unity-background-image-tint-color, scale;
    transition-duration: var(--sm-dur-fast);
    transition-timing-function: ease-out;
}

.sm-close-btn:hover {
    background-color: rgba(220, 60, 60, 0.18);
    
}

.sm-close-btn:active {
    scale: 0.92 0.92;
    
}

.sm-close-btn:disabled {
    
}

/* ──────────────────────────────────────────────────────────────────── */
/*  Phase 21b-2: empty-state polish.                                    */
/*  Inline empty-state labels that hang off list-style panels (Notif    */
/*  Feed watchlist / event feed, Diplomacy event feed). Slightly        */
/*  smaller + more muted than full-screen empty states so they fit      */
/*  comfortably under a header without dominating the panel.            */
/* ──────────────────────────────────────────────────────────────────── */

.sm-nf__inline-empty,
.sm-dip__inline-empty,
.sm-nf__empty {
    font-size: 11px;
    color: rgba(140, 150, 165, 0.85);
    text-align: center; justify-content: center; align-items: center;
    white-space: normal;
    padding-top: 14px;
    padding-bottom: 14px;
    padding-left: 18px;
    padding-right: 18px;
}

.sm-dip__list-empty {
    font-size: 12px;
    color: rgba(140, 150, 165, 0.85);
    text-align: center; justify-content: center; align-items: center;
    white-space: normal;
    padding-top: 24px;
    padding-bottom: 24px;
    padding-left: 24px;
    padding-right: 24px;
}

/* ──────────────────────────────────────────────────────────────────── */
/* §31 — LiveSkeletonDisplay                                            */
/* Canonical async-content shimmer skeleton. Used by every LLM-driven   */
/* text surface during load. Players see placeholder bars + shimmer     */
/* pulse, NEVER fallback prose presented as if it were real content.    */
/* The shimmer is driven by VisualElement.schedule (UI Toolkit lacks    */
/* CSS @keyframes) — these rules just style the static appearance.     */
/* ──────────────────────────────────────────────────────────────────── */

.sm-skeleton {
    flex-direction: column;
    align-items: stretch;
}

.sm-skeleton-line {
    height: 12px;
    background-color: var(--sm-surface-3);
    border-top-left-radius: 2px;
    border-top-right-radius: 2px;
    border-bottom-left-radius: 2px;
    border-bottom-right-radius: 2px;
    margin-top: 4px;
    margin-bottom: 4px;
}

.sm-skeleton-loading > .sm-skeleton-line {
    background-color: var(--sm-surface-3);
}

.sm-skeleton-loaded > .sm-skeleton-line,
.sm-skeleton-error  > .sm-skeleton-line {
    display: none;
}

.sm-skeleton-label {
    color: var(--sm-text);
    font-size: var(--sm-text-md);
    white-space: normal;

/*
 * Track M-9 / F-D14 — z-order taxonomy (CodeConventions §12).
 *
 * Unity UI Toolkit stacks siblings by DOM order; these classes are
 * semantic anchors so:
 *   • ScreenRouter / overlay managers can reorder roots deterministically;
 *   • lint / audit can verify every screen carries an explicit layer tag;
 *   • future Unity versions that honour explicit ordering can wire
 *     numeric values without churning the UXML.
 *
 * Layers (top to bottom in display order):
 *   sm-l1-base     — base background (world globe, full-screen views)
 *   sm-l2-panels   — primary panels (top bar, nav rail, screens)
 *   sm-l3-overlays — non-blocking overlays (dropdowns, flyouts, side sheets)
 *   sm-l4-modals   — modal dialogs (block interaction beneath)
 *   sm-l5-tooltips — tooltips / hover popovers (always topmost)
 */
.sm-l1-base     { /* base layer */ }
.sm-l2-panels   { /* primary-panel layer */ }
.sm-l3-overlays { /* non-blocking-overlay layer */ }
.sm-l4-modals   { /* modal layer */ }
.sm-l5-tooltips { /* tooltip layer */ }

/* ── Assets/UI/Theme/theme-present-polish.uss ── */
/*
 * SpyMaster · Present-Era Polish Layer (v2)
 * ------------------------------------------------------------
 * Reference: Assets/../Claude Design/PRESENT_VISUAL_DIFFERENTIATION.md
 *
 * Loaded AFTER tokens.uss + theme.uss to layer the v2 polish moves on
 * top of the existing design system. Add this stylesheet to the same
 * PanelSettings as theme.uss.
 *
 * Goal: stop looking like generic dark-mode SaaS, start looking like an
 * actual intelligence agency tool. Implements the 10 differentiation
 * moves from PRESENT_VISUAL_DIFFERENTIATION.md as opt-in utility classes.
 *
 * USAGE:
 *   - Add `sm-stationery-header` to any small DOC.ID·CLASS·DIST header
 *     element on a panel (typically aligned top-right, 9pt mono).
 *   - Add `sm-terminal-status` to a horizontal strip at the bottom of
 *     each screen showing BUILD·SESSION·CHANNEL chrome.
 *   - Add `sm-paper-grain` to any panel that should carry the
 *     subliminal paper-grain texture (most panels — make it the
 *     default on .sm-panel by extending it later if you want).
 *   - Add `sm-analyst-prose` to any text Visual that contains LLM-
 *     generated narrative (Director's Desk letter, Mission Report
 *     debrief, threat assessment summary, mole-hunt CI report).
 *   - Add `sm-numeral-display` to big numerals (BLACK BUDGET, GLOBAL
 *     HEAT, DOOMSDAY, mission SCORE).
 *   - Add `sm-title-slab` to screen titles 18pt+.
 *   - Add `sm-named-empty` to empty-state Labels (italicized, with a
 *     trailing em-dash + role attribution).
 *
 * Every class below is an additive opt-in. No existing element changes
 * appearance unless the class is added.
 * ------------------------------------------------------------
 */

/* =========================================================
 * STATIONERY HEADER (move 3)
 *
 * Top-right of every panel: DOC.ID · CLASS · DIST in monospace 9pt at
 * --sm-stationery-opacity. Reads as "official document chrome" rather
 * than as content.
 *
 * Recommended placement: position absolute top-right of .sm-panel.
 * Recommended copy: e.g. `DOC.ID: 14F-37-A · CLASS: TS//SCI · DIST: DIRECTOR ONLY`
 * ========================================================= */
.sm-stationery-header {
    
    font-size: var(--sm-text-micro);
    color: var(--sm-text-muted);
    font-weight: 400; font-style: normal;
    letter-spacing: var(--sm-letter-mono-caps);
    text-align: right; justify-content: right; align-items: center;
    padding-top: 4px;
    padding-bottom: 4px;
    padding-left: 8px;
    padding-right: 8px;
    opacity: var(--sm-stationery-opacity);
    /* Position top-right inside the panel; consumer can override
       with align-self/position absolute as needed. */
    align-self: flex-end;
}

.sm-stationery-header--left {
    text-align: left; justify-content: left; align-items: center;
    align-self: flex-start;
}

/* =========================================================
 * TERMINAL STATUS STRIP (move 4)
 *
 * 24px horizontal strip at the very bottom of every screen showing:
 *   BUILD 0.4.7-RC · SESSION 14F37ED7 · CHANNEL SECURE · LATENCY 18MS
 *   · UPLINK NORMAL · CONSOLE LIVE
 *
 * Sits below the Ticker. Same opacity register as stationery header.
 * Reads as a real terminal status bar, not a SaaS product footer.
 * ========================================================= */
.sm-terminal-status {
    height: var(--sm-terminal-status-h);
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding-left: var(--sm-s-3);
    padding-right: var(--sm-s-3);
    background-color: var(--sm-nav-bg);
    border-top-width: var(--sm-stroke);
    border-top-color: var(--sm-border);
    
    font-size: var(--sm-text-micro);
    color: var(--sm-text-muted);
    letter-spacing: var(--sm-letter-mono-caps);
    opacity: var(--sm-stationery-opacity);
}

.sm-terminal-status__cell {
    flex-direction: row;
    align-items: center;
    margin-right: var(--sm-s-2);
}

.sm-terminal-status__live-dot {
    width: 6px;
    height: 6px;
    border-top-left-radius: 3px;
    border-top-right-radius: 3px;
    border-bottom-left-radius: 3px;
    border-bottom-right-radius: 3px;
    background-color: var(--sm-identity);
    margin-right: var(--sm-s-1);
}

/* =========================================================
 * PAPER-GRAIN TEXTURE OVERLAY (move 7)
 *
 * Adds a faint paper-grain texture to a panel background. Subliminal
 * — registers as "this is a printed report" rather than as decoration.
 *
 * Implementation: applies the existing paper-grain.svg as a tiled
 * background image at very low opacity. The SVG is at
 * Assets/UI/MainMenu/paper-grain.svg.
 *
 * Apply to .sm-panel directly: <VisualElement class="sm-panel sm-paper-grain">
 * ========================================================= */
.sm-paper-grain {
    background-image: var(--sm-paper-grain-url);
    
    /* Tiling effect by sizing the SVG to repeat across the panel; the SVG
       itself defines the noise tile. Opacity is layered onto the panel via
       the SVG's source alpha rather than via CSS opacity to avoid washing
       out child content. */
}

/* =========================================================
 * ANALYST-PROSE STYLE (move 8)
 *
 * Italicized body text for any LLM-generated analyst narrative —
 * Director's Desk letter body, Mission Report debrief, threat
 * assessment summary, mole-hunt CI reports, walk-in briefings.
 *
 * Italics signal "human voice" vs. "system output" — players read
 * italic text as someone-wrote-this, roman text as the-game-says-this.
 *
 * Apply to the body Label of any analyst-authored content. The
 * sender/signoff line below it can be roman secondary mono.
 * ========================================================= */
.sm-analyst-prose {
    font-style: italic;
    color: var(--sm-text);
    font-size: var(--sm-text-md);
    /* Generous line-height for legibility on long-form prose. */
    
}

/* For LLM-generated [REDACTED] inline tokens — black bar with
   block-character placeholders. Pair with: <Label>The previous
   Director — <Label class="sm-redacted">████████</Label> — was last
   seen at...</Label>. */
.sm-redacted {
    background-color: #000000;
    color: #000000;
    
    /* The text is opaque black; the chars exist so the bar has the
       right width but they're invisible. Don't use this as a button. */
    padding-left: 4px;
    padding-right: 4px;
    letter-spacing: -1px;
}

/* =========================================================
 * BIG-NUMERAL DISPLAY (move 9)
 *
 * For BLACK BUDGET, GLOBAL HEAT, DOOMSDAY, mission SCORE, anywhere
 * a big number is the visual hero of a panel.
 *
 * Counter-intuitive: Inter Light (200) at 28-88pt reads as
 * institutional report typography (Bloomberg, FT, declassified
 * reports). Inter Bold at the same sizes reads as SaaS dashboard
 * metric. Use Light for big numerals.
 *
 * If your Inter font asset only includes Regular weight, the
 * synthesized "lighter" weight from Unity is acceptable — but
 * commission/license Inter Light .ttf for the AAA polish.
 * ========================================================= */
.sm-numeral-display {
    
    font-weight: 400; font-style: normal;
    /* Visual weight comes from size, not from boldness. */
    font-size: var(--sm-text-3xl);
    color: var(--sm-text);
    /* Tabular old-style numerals if the font supports them; the
       OpenType "tnum" feature can be enabled in the font asset
       importer (Tabular Numbers checkbox). */
    text-align: left; justify-content: left; align-items: center;
}

.sm-numeral-display--xl {
    font-size: var(--sm-text-display);
}

.sm-numeral-display--mono {
    
}

/* =========================================================
 * SLAB-SERIF TITLE (move 10)
 *
 * Screen titles 18pt+ use the slab-serif font. Inter sans is for
 * UI labels and body. The slab-serif title is the typographic
 * differentiator — it makes the screen feel like a printed report
 * rather than a software panel.
 *
 * Recommended use: SPYMASTER wordmark, screen title bars, dossier
 * subject names (JANE DOE), mission codenames (OP. NIGHTHAWK).
 *
 * Drop-in font when art commissions: Roboto Slab Bold or Zilla
 * Slab. Until the asset lands, falls back to sans-serif which is
 * acceptable but not the polish target.
 * ========================================================= */
.sm-title-slab {
    
    font-weight: 700;
    font-size: var(--sm-text-xl);
    color: var(--sm-text);
    letter-spacing: 0;
}

.sm-title-slab--xl {
    font-size: var(--sm-text-2xl);
}

.sm-title-slab--display {
    font-size: var(--sm-text-3xl);
}

/* =========================================================
 * NAMED-ANALYST EMPTY STATES (move 5)
 *
 * Empty-state Labels are NOT "You don't have any X yet!" SaaS-style
 * copy. They're italicized one-liners attributed to a named role at
 * the agency:
 *
 *   "Operations stands ready to receive standing orders. — Ops Chief, R."
 *   "The watch floor is quiet. — Watch Officer, K."
 *   "Inbox clear. Listening posts active. — D. Kim, Cyber Branch."
 *
 * Style: italic body, secondary color, with a smaller roman attribution
 * after the em-dash. Players gradually build a mental model of the staff.
 * ========================================================= */
.sm-named-empty {
    font-style: italic;
    color: var(--sm-text-secondary);
    font-size: var(--sm-text-md);
    text-align: center; justify-content: center; align-items: center;
    padding: var(--sm-s-6);
    /* Prose generously line-broken — ~32-40em max. */
    max-width: 460px;
    align-self: center;
    white-space: normal;
}

/* For the attribution portion (after the em-dash). Wrap in a
   <Label class="sm-named-empty__attribution">— Ops Chief, R.</Label>
   inside the parent .sm-named-empty container, OR style as a
   second line via paragraph break. */
.sm-named-empty__attribution {
    font-weight: 400; font-style: normal;
    color: var(--sm-text-muted);
    font-size: var(--sm-text-sm);
    margin-top: var(--sm-s-1);
}

/* =========================================================
 * AGENCY IDENTITY UTILITIES (move 1, 6)
 *
 * Wherever the agency mark / primary identity color appears.
 * Pulls from --sm-identity (which currently aliases --sm-alert =
 * classified-red #D14B3D).
 *
 * .sm-identity-mark — color the agency crest / wordmark stroke.
 * .sm-identity-bar  — 3-4px left bar showing identity (used on
 *                     focused menu items, primary action buttons).
 * .sm-identity-stamp — diagonal CLASSIFIED rubber-stamp affect.
 * ========================================================= */
.sm-identity-mark {
    color: var(--sm-identity);
    
}

.sm-identity-bar {
    border-left-width: 3px;
    border-left-color: var(--sm-identity);
}

.sm-identity-stamp {
    color: var(--sm-identity);
    font-weight: 700;
    letter-spacing: 2px;
    font-size: var(--sm-text-xl);
    rotate: -8deg;
    border-left-width: 2px;
    border-right-width: 2px;
    border-top-width: 2px;
    border-bottom-width: 2px;
    border-left-color: var(--sm-identity);
    border-right-color: var(--sm-identity);
    border-top-color: var(--sm-identity);
    border-bottom-color: var(--sm-identity);
    padding-left: var(--sm-s-3);
    padding-right: var(--sm-s-3);
    padding-top: var(--sm-s-1);
    padding-bottom: var(--sm-s-1);
    background-color: var(--sm-identity-soft);
}

/* =========================================================
 * BREATHING ALERT DOT (move 1)
 *
 * The LIVE indicator dot — 8px circle in identity-red, very slow
 * pulse. Already implemented elsewhere as a one-off; standardized
 * here so every screen uses the same component.
 *
 * Note: USS animations on opacity are limited in UI Toolkit. For
 * actual pulsing, pair with C# code using schedule.Execute()
 * cycling opacity 1.0 → 0.4 over 2400ms.
 * ========================================================= */
.sm-live-dot {
    width: 8px;
    height: 8px;
    border-top-left-radius: 4px;
    border-top-right-radius: 4px;
    border-bottom-left-radius: 4px;
    border-bottom-right-radius: 4px;
    background-color: var(--sm-identity);
    /* C# controller sets opacity in a 2.4s loop */
}

/* =========================================================
 * MONO-CAPS LABEL (used everywhere)
 *
 * The institutional-document feel comes from breathing letter-spacing
 * on small caps. This is the standard treatment for any micro-label
 * that says "this is a category" — DEPARTMENTS, ACTIVE OPERATIONS,
 * GOVERNMENT CONFIDENCE, etc.
 *
 * Pair with --sm-text-xs or --sm-text-sm for the actual size.
 * ========================================================= */
.sm-mono-caps {
    
    font-weight: 400; font-style: normal;
    font-size: var(--sm-text-xs);
    color: var(--sm-text-secondary);
    letter-spacing: var(--sm-letter-mono-caps);
    /* Unity USS does not support text-transform; consumer must
       provide UPPERCASE text. */
}

/* =========================================================
 * VOICE-RIBBON (Futuristic-era, scaffolded for future DLC)
 *
 * The AI co-analyst's voice ribbon — a thin teal line with the
 * AI's spoken text trailing it. Used in the Director's Desk
 * overlay (Futuristic era), the Mission Report cinematic, etc.
 *
 * Empty rule for v1 — Present era doesn't use voice ribbons.
 * Defined here so .era-futuristic stylesheet can populate.
 * ========================================================= */
.sm-voice-ribbon { }
